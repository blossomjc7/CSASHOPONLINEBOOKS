<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Crisp Premium Background -->
  <rect width="100%" height="100%" fill="#FAFBF9"/>

  <!-- Outer Double Book Border: Vibrant Forest Evergreen -->
  <rect x="18" y="18" width="364" height="564" rx="12" fill="#FFFFFF" stroke="#2D5A43" stroke-width="3"/>
  <rect x="25" y="25" width="350" height="550" rx="8" fill="none" stroke="#2D5A43" stroke-width="1.2" opacity="0.35"/>

  <!-- Inner Arch Focal Panel: Evergreen Tint with Strong Border -->
  <path d="M 85 105 Q 200 68 315 105 L 315 425 Q 200 460 85 425 Z" fill="#EBF4EE" stroke="#2D5A43" stroke-width="2.5"/>

  <!-- Tap Root Emblem: Symbolizing Deep Spiritual Rooting in Faith -->
  <g transform="translate(200, 155)">
    <circle cx="0" cy="0" r="34" fill="#2D5A43" opacity="0.15"/>
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#2D5A43" stroke-width="2.5"/>
    
    <!-- Central Shoot / Stem rising upward -->
    <path d="M 0 -18 L 0 -4" stroke="#2D5A43" stroke-width="3.2" stroke-linecap="round"/>
    
    <!-- Sprouting Young Leaves -->
    <path d="M 0 -12 Q -7 -18 -8 -23 Q -3 -22 0 -15" fill="#2D5A43"/>
    <path d="M 0 -12 Q 7 -18 8 -23 Q 3 -22 0 -15" fill="#2D5A43"/>
    
    <!-- Central Deep Tap Root -->
    <path d="M 0 -4 Q 1 6 0 16 Q -1 22 0 25" stroke="#2D5A43" stroke-width="3.8" fill="none" stroke-linecap="round"/>
    
    <!-- Lateral Anchor Roots extending deep into ground -->
    <path d="M 0 3 Q -9 8 -16 12" stroke="#2D5A43" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 3 Q 9 8 16 12" stroke="#2D5A43" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 10 Q -8 15 -13 20" stroke="#2D5A43" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M 0 10 Q 8 15 13 20" stroke="#2D5A43" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M 0 17 Q -5 21 -9 24" stroke="#2D5A43" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 17 Q 5 21 9 24" stroke="#2D5A43" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Collection Header: High-Vibrancy Forest Green -->
  <text x="200" y="58" font-family="'Montserrat', system-ui, sans-serif" font-size="11" font-weight="800" fill="#2D5A43" text-anchor="middle" letter-spacing="2.5">THE NEW BELIEVER COLLECTION</text>

  <!-- Concept Badge: High-Contrast Solid Evergreen Pill -->
  <rect x="65" y="222" width="270" height="25" rx="12.5" fill="#2D5A43"/>
  <text x="200" y="238.5" font-family="'Montserrat', system-ui, sans-serif" font-size="8.8" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">CONCEPT 2: THEOPHANIES - GOD IN THE FLESH</text>

  <!-- Main Title: High-Contrast Midnight Navy & Emerald -->
  <text x="200" y="306" font-family="'Playfair Display', Georgia, serif" font-size="27" font-weight="bold" fill="#0A1128" text-anchor="middle">BEFORE THE</text>
  <text x="200" y="344" font-family="'Playfair Display', Georgia, serif" font-size="27" font-weight="bold" fill="#2D5A43" text-anchor="middle">MANGER</text>

  <!-- Subtitle: High-Contrast Dark Slate / Midnight (100% Readable at a Glance) -->
  <text x="200" y="445" font-family="'Montserrat', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F241A" text-anchor="middle" letter-spacing="0.6">DISCOVERING THE PHYSICAL PRESENCE OF</text>
  <text x="200" y="464" font-family="'Montserrat', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F241A" text-anchor="middle" letter-spacing="0.6">JESUS IN THE OLD TESTAMENT</text>

  <!-- Author Signature -->
  <text x="200" y="546" font-family="'Montserrat', system-ui, sans-serif" font-size="14" font-weight="800" fill="#0A1128" text-anchor="middle" letter-spacing="3.5">CHRISTINE A.</text>
</svg>