<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Crisp Premium Background -->
  <rect width="100%" height="100%" fill="#FAFBF9"/>

  <!-- Outer Double Book Border: Forest Evergreen -->
  <rect x="18" y="18" width="364" height="564" rx="12" fill="#FFFFFF" stroke="#2D5A43" stroke-width="2.5"/>
  <rect x="24" y="24" width="352" height="552" rx="8" fill="none" stroke="#2D5A43" stroke-width="1" opacity="0.3"/>

  <!-- Inner Arch Focal Panel: Faint pastel mint #F4F8F5, lifted bottom curve (y=370) so subtitle never crosses! -->
  <path d="M 85 98 Q 200 68 315 98 L 315 370 Q 200 400 85 370 Z" fill="#F4F8F5" stroke="#2D5A43" stroke-width="1.2" opacity="0.85"/>

  <!-- Compact Tap Root Icon: Small elegant r=22 (exact size match to original aesthetic) -->
  <g transform="translate(200, 148)">
    <circle cx="0" cy="0" r="22" fill="#2D5A43" opacity="0.12"/>
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#2D5A43" stroke-width="1.5"/>
    
    <!-- Original clean stem and arch with delicate tap root branches -->
    <path d="M -9 -7 Q 0 -15 9 -7 M 0 -15 L 0 3" stroke="#2D5A43" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 0 3 L 0 14" stroke="#2D5A43" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 0 6 L -7 11" stroke="#2D5A43" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 0 6 L 7 11" stroke="#2D5A43" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 0 10 L -5 13" stroke="#2D5A43" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 0 10 L 5 13" stroke="#2D5A43" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Collection Header -->
  <text x="200" y="54" font-family="'Montserrat', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#2D5A43" text-anchor="middle" letter-spacing="2.5">THE NEW BELIEVER COLLECTION</text>

  <!-- Concept Badge: Solid Evergreen Pill -->
  <rect x="70" y="194" width="260" height="23" rx="11.5" fill="#2D5A43"/>
  <text x="200" y="209" font-family="'Montserrat', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">CONCEPT 3: MESSIANIC PROPHECIES FULFILLED</text>

  <!-- Main Title: High-Contrast Midnight Navy & Emerald -->
  <text x="200" y="272" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="#0A1128" text-anchor="middle">PROPHECY</text>
  <text x="200" y="308" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="#2D5A43" text-anchor="middle">FULFILLED</text>

  <!-- Subtitle: Located below the lifted arch panel with zero overlap -->
  <text x="200" y="434" font-family="'Montserrat', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F241A" text-anchor="middle" letter-spacing="0.8">A 30-DAY GUIDE TO THE</text>
  <text x="200" y="456" font-family="'Montserrat', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F241A" text-anchor="middle" letter-spacing="0.8">PREDICTIONS THAT CHANGED THE WORLD</text>

  <!-- Author Signature -->
  <text x="200" y="546" font-family="'Montserrat', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0A1128" text-anchor="middle" letter-spacing="3.5">CHRISTINE A.</text>
</svg>